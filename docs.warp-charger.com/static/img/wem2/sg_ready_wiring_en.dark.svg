<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="362" viewBox="0 35 960 362" font-family="Arial, Helvetica, sans-serif" fill="#e3e3e3">
  <!-- WARP Energy Manager 2.0 -->
  <rect x="20" y="50" width="330" height="290" rx="8" fill="none" stroke="#e3e3e3" stroke-width="2"/>
  <text x="36" y="80" font-size="18" font-weight="bold">WARP Energy Manager 2.0</text>
  <text x="330" y="108" font-size="13" font-weight="bold" text-anchor="end">SG RDY</text>

  <!-- Output 1 -->
  <text x="36" y="148" font-size="15" font-weight="bold">Output 1</text>
  <text x="36" y="166" font-size="13">(blocking)</text>
  <rect x="190" y="135" width="32" height="30" fill="none" stroke="#e3e3e3" stroke-width="2"/>
  <line x1="222" y1="150" x2="243" y2="151" stroke="#e3e3e3" stroke-width="1.5" stroke-dasharray="4 3"/>
  <path d="M341 130 H250 V138 M341 170 H250 V162 M250 162 L236 140" fill="none" stroke="#e3e3e3" stroke-width="2"/>
  <circle cx="250" cy="138" r="2.5"/>
  <circle cx="250" cy="162" r="2.5"/>
  <text x="330" y="155" font-size="14" font-weight="bold" text-anchor="end">1</text>

  <!-- Output 2 -->
  <text x="36" y="258" font-size="15" font-weight="bold">Output 2</text>
  <text x="36" y="276" font-size="13">(extended)</text>
  <rect x="190" y="245" width="32" height="30" fill="none" stroke="#e3e3e3" stroke-width="2"/>
  <line x1="222" y1="260" x2="243" y2="261" stroke="#e3e3e3" stroke-width="1.5" stroke-dasharray="4 3"/>
  <path d="M341 240 H250 V248 M341 280 H250 V272 M250 272 L236 250" fill="none" stroke="#e3e3e3" stroke-width="2"/>
  <circle cx="250" cy="248" r="2.5"/>
  <circle cx="250" cy="272" r="2.5"/>
  <text x="330" y="265" font-size="14" font-weight="bold" text-anchor="end">2</text>

  <text x="36" y="312" font-size="13">potential-free NO contacts</text>
  <text x="36" y="330" font-size="13">max. 125 V AC / 110 V DC, 2 A</text>

  <!-- Control cable -->
  <path d="M359 130 H601 M359 170 H601" fill="none" stroke="#e07b00" stroke-width="2.5"/>
  <path d="M359 240 H601 M359 280 H601" fill="none" stroke="#3b8eea" stroke-width="2.5"/>
  <ellipse cx="480" cy="205" rx="20" ry="100" fill="none" stroke="#e3e3e3" stroke-width="1.5"/>
  <text x="480" y="90" font-size="15" font-weight="bold" text-anchor="middle">1 control cable, 4 cores</text>
  <text x="480" y="330" font-size="13" text-anchor="middle">e.g. J-Y(ST)Y 2×2×0.8</text>
  <text x="480" y="348" font-size="13" text-anchor="middle">or LiYY 4×0.5 mm²</text>

  <!-- Heat pump box -->
  <rect x="610" y="50" width="330" height="290" rx="8" fill="none" stroke="#e3e3e3" stroke-width="2"/>

  <!-- Terminals -->
  <g fill="#2fb344" stroke="#e3e3e3" stroke-width="1.5">
    <rect x="341" y="121" width="18" height="18"/>
    <rect x="341" y="161" width="18" height="18"/>
    <rect x="341" y="231" width="18" height="18"/>
    <rect x="341" y="271" width="18" height="18"/>
    <rect x="601" y="121" width="18" height="18"/>
    <rect x="601" y="161" width="18" height="18"/>
    <rect x="601" y="231" width="18" height="18"/>
    <rect x="601" y="271" width="18" height="18"/>
  </g>

  <!-- Heat pump -->
  <text x="630" y="80" font-size="18" font-weight="bold">Heat pump</text>

  <path d="M619 130 H660 M619 170 H660 M619 240 H660 M619 280 H660" fill="none" stroke="#e3e3e3" stroke-width="2"/>
  <rect x="660" y="115" width="262" height="70" rx="4" fill="none" stroke="#e3e3e3" stroke-width="2"/>
  <text x="676" y="145" font-size="14" font-weight="bold">SG-Ready input 1</text>
  <text x="676" y="166" font-size="13">(e.g. SG1 / utility lock)</text>
  <rect x="660" y="225" width="262" height="70" rx="4" fill="none" stroke="#e3e3e3" stroke-width="2"/>
  <text x="676" y="255" font-size="14" font-weight="bold">SG-Ready input 2</text>
  <text x="676" y="276" font-size="13">(e.g. SG2)</text>

  <text x="626" y="316" font-size="13">For terminal names, see</text>
  <text x="626" y="332" font-size="13">the heat pump manual</text>

  <text x="20" y="382" font-size="13">Heat pumps that require 230 V AC at their SG-Ready inputs must only be connected via coupling relays.</text>
</svg>
